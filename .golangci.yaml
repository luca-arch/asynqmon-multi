version: "2"
run:
    allow-parallel-runners: true
linters:
    enable:
        - arangolint
        - asasalint
        - asciicheck
        - bidichk
        - bodyclose
        - canonicalheader
        - clickhouselint
        - containedctx
        - contextcheck
        - copyloopvar
        - cyclop
        - decorder
        - depguard
        - dogsled
        - dupl
        - dupword
        - durationcheck
        - embeddedstructfieldcheck
        - err113
        - errcheck
        - errchkjson
        - errname
        - errorlint
        - exhaustive
        - exhaustruct
        - exptostd
        - fatcontext
        - forbidigo
        - forcetypeassert
        - funcorder
        - funlen
        - ginkgolinter
        - gocheckcompilerdirectives
        - gochecknoglobals
        - gochecknoinits
        - gochecksumtype
        - gocognit
        - goconst
        - gocritic
        - gocyclo
        - godoclint
        - godot
        - godox
        - goheader
        - gomoddirectives
        - gomodguard_v2
        - goprintffuncname
        - gosec
        - gosmopolitan
        - govet
        - grouper
        - iface
        - importas
        - inamedparam
        - ineffassign
        - interfacebloat
        - intrange
        - iotamixing
        - ireturn
        - lll
        - loggercheck
        - maintidx
        - makezero
        - mirror
        - misspell
        - mnd
        - modernize
        - musttag
        - nakedret
        - nestif
        - nilerr
        - nilnesserr
        - nilnil
        - nlreturn
        - noctx
        - nolintlint
        - nonamedreturns
        - nosprintfhostport
        - paralleltest
        - perfsprint
        - prealloc
        - predeclared
        - promlinter
        - protogetter
        - reassign
        - recvcheck
        - revive
        - rowserrcheck
        - sloglint
        - spancheck
        - sqlclosecheck
        - staticcheck
        - tagalign
        - tagliatelle
        - testableexamples
        - testifylint
        - testpackage
        - thelper
        - tparallel
        - unconvert
        - unparam
        - unqueryvet
        - unused
        - usestdlibvars
        - usetesting
        - wastedassign
        - whitespace
        - wrapcheck
        - wsl_v5
        - zerologlint
    settings:
        cyclop:
            max-complexity: 15
        depguard:
            rules:
                prevent_unmaintained_packages:
                    list-mode: lax
                    files:
                        - $all
                        - "!$test"
                    allow:
                        - $gostd
                    deny:
                        - pkg: io/ioutil
                          desc: "replaced by io and os packages since Go 1.16: https://tip.golang.org/doc/go1.16#ioutil"
        dupl:
            threshold: 100
        forbidigo:
            analyze-types: true
            forbid:
                - pattern: print(ln)?$
                  msg: default
        funlen:
            lines: 120
            statements: 80
            ignore-comments: true
        goconst:
            min-len: 2
            min-occurrences: 5
        gocyclo:
            min-complexity: 15
        govet:
            enable-all: true
            disable:
                - fieldalignment # Prefer AZ ordering of fields
            settings:
                printf:
                    funcs:
                        - (github.com/golangci/golangci-lint/pkg/logutils.Log).Infof
                        - (github.com/golangci/golangci-lint/pkg/logutils.Log).Warnf
                        - (github.com/golangci/golangci-lint/pkg/logutils.Log).Errorf
                        - (github.com/golangci/golangci-lint/pkg/logutils.Log).Fatalf
            shadow:
                strict: true
        lll:
            line-length: 100
            tab-width: 1
        misspell:
            locale: UK
        mnd:
            ignored-numbers:
                - "0o600"
                - "0o644"
                - "0o755"
        nolintlint:
            require-explanation: true
            require-specific: true
    exclusions:
        generated: lax
        presets:
            - comments
            - common-false-positives
            - legacy
            - std-error-handling
        rules:
            - linters:
                  - exhaustruct
              path: _test\.go
        paths:
            - third_party$
            - builtin$
            - examples$
formatters:
    enable:
        - gci
        - gofmt
        - gofumpt
        - goimports
    exclusions:
        generated: lax
        paths:
            - third_party$
            - builtin$
            - examples$
